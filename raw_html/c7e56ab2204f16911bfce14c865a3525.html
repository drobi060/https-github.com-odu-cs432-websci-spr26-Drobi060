    <!-- load bare minimum css and loader to get fastest time to render -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        min-width: 100%;

      }

      .app-loader {
        align-items: center;
        background-color: #ffffff;
        bottom: 0;
        display: flex;
        justify-content: center;
        left: 0;
        opacity: 0;
        position: fixed;
        right: 0;
        top: 0;
        visibility: hidden;
        z-index: 1;
        transition: opacity 75ms, visibility 75ms;
      }

      .app-loader.is-visible {
        opacity: 1;
        visibility: visible;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .app-loader__spinner {
        animation: app-loader-spin .75s linear infinite;
        border: 8px solid #505455;
        border-radius: 50%;
        border-right-color: transparent;
        display: inline-block;
        height: 68px;
        width: 68px;
      }

      .app-loader__screenreader-text {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        border: 0;
        clip: rect(0, 0, 0, 0);
      }

      body > .ember-view {
        /* NOTE: visibility:hidden will still show visible children */
        display: none;
      }

      body > .ember-view.is-visible {
        display: block;
      }
    </style>
    <div class="app-loader is-visible">
