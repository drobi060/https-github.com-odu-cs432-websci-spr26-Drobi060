uilder.template.onboarding.slide2.title":"Author a template and add instructions","builder.template.onboarding.slide2.text":"The template builder closely resembles the story builder, but with one key addition: the instructions block. Use this block to add notes or directions for future authors. Instructions are visible in the builder, but hidden in the published story.","builder.template.onboarding.slide3.title":"Publish and share","builder.template.onboarding.slide3.text":"Templates are published and shared just like stories. A private template is accessible only to you and administrators in your organization, while a public template can be used by anyone.","viewer.convertAndUploadMedia.inlineMessage":"Uploading...","viewer.convertAndUploadMedia.loading":"Loading...","viewer.swipe.handle.ariaLabel":"Compare media by using the left and right arrow keys","viewer.swipe.map.placeholder.map1":"Map 1","viewer.swipe.map.placeholder.map2":"Map 2","viewer.tour.data.category.noTitle":"Untitled category","viewer.tour.skipTour":"Skip tour","component.storyLogo.default.altText":"Story logo","component.themePreviewSampleStory.header":"You can edit this header style in Theme Colors","component.themePreviewSampleStory.storycover.title":"This is your story’s title","component.themePreviewSampleCollection.collectioncover.title":"This is your collection’s title","component.themePreviewSampleStory.storycover.summary":"Use this sample story to preview your custom theme. As you modify colors, typography, and more, those changes will be reflected here.","component.themePreviewSampleCollection.collectioncover.summary":"Use this sample collection to preview your custom theme. As you modify colors, typography, and more, those changes will be reflected here.","component.themePreviewSampleStory.storycover.byline":"Author byline","component.themePreviewSampleCollection.item.title":"Item title","component.themePreviewSampleStory.navigation.credits":"Credits","component.themePreviewSampleStory.bodyText1":"This story includes several of the pieces you might use in your own story – like paragraphs, buttons, separators, and more. To get started, expand a section of the styling panel and make some adjustments. As you make changes, you’ll see this story demonstrate how they look. For example, try changing the background color and observe how the story and the navigation bar (above) change.","component.themePreviewSampleStory.bodyText2":"Next, try changing the paragraph font, and see what happens to this text. Then, try adjusting the quote style and alignment to see how your choices affect the quote below. You’ll also notice that a quote uses the paragraph font for its text.","component.themePreviewSampleStory.bodyText3":"You can style your paragraph text to use \u003cstrong\u003ebold\u003c/strong\u003e, \u003cem\u003eitalics\u003c/em\u003e, and \u003cem\u003e\u003cstrong\u003ebold italics\u003c/strong\u003e\u003c/em\u003e, so you can emphasize important text accordingly. These come pre-packaged with the fonts you’ve chosen, so there’s nothing extra you need to configure.","component.themePreviewSampleStory.bodyText4":"If you add an express map to your story, your drawn features will use the accent color.","component.themePreviewSampleStory.bodyText5":"The accent colors are used to show data in charts. Chart and axis titles use the heading font.","component.themePreviewSampleStory.bodyText7":"Your theme’s secondary background color is used for content elements including table heading rows and the credits section (below). Tables use the paragraph color and font; the header row uses bold paragraph style.","component.themePreviewSampleStory.bodyText8":"You have a few different options for separator styles; toggle between them and see how the separator below changes. Your theme’s accent color is used in separators, quotes, buttons, and links (unless you override it).","component.themePreviewSampleStory.bodyText9":"Wondering what embed cards look like? Check out the one below!","component.themePreviewSampleStory.sectionHeadingH2.basicBlocks":"Basic blocks","component.themePreviewSampleStory.sectionHeadingH2.contentBlocks":"Media","component.themePreviewSampleStory.sectionHeadingH2.dataVisualization":"Data visualization","component.themePreviewSampleStory.button.text":"This is a button","component.themePreviewSampleCollection.button.text":"Button style","component.themePreviewSampleStory.quote":"Quotes use the theme’s title font, but you can also choose one of several different styling options.","component.themePreviewSampleStory.chart.fieldText1":"Accent color","component.themePreviewSampleStory.chart.fieldText2":"Optional accent 1","component.themePreviewSampleStory.chart.fieldText3":"Optional accent 2","component.themePreviewSampleStory.chart.axisCategory":"Category axis title","component.themePreviewSampleStory.chart.axisValue":"Value axis title","component.themePreviewSampleStory.chart.title":"Accent colors","component.themePreviewSampleStory.chart.categoryText1":"Theme colors","component.themePreviewSampleStory.quoteAttribution":"The quote source goes here","component.themePreviewSampleStory.sectionHeadingH3.audio":"Audio","component.themePreviewSampleStory.sectionHeadingH3.embed":"Embed","component.themePreviewSampleStory.sectionHeadingH3.expressmap":"Express map","component.themePreviewSampleStory.sectionHeadingH3.chart":"Chart","component.themePreviewSampleStory.sectionHeadingH3.table":"Table","component.themePreviewSampleStory.caption":"This is caption text, it inherits the font you’ve chosen for paragraph text. You can specify its color, too.","component.themePreviewSampleStory.embed.description":"Create inspiring, immersive stories by combining text, interactive maps, and other multimedia content. Publish and share your story with your organization or everyone around the world.","component.themePreviewSampleStory.bodyText10":"Below is an example of the audio player. The video player control bar and 360 image navigation bar use the same styles.","component.themePreviewSampleStory.text10":"This is the heading for the story credits. It uses the title font.","component.themePreviewSampleStory.text11":"This is where the credit description goes; it uses the paragraph font. The secondary background color is here, too.","component.themePreviewSampleStory.attribution.content":"\u003cstrong\u003eA credit goes here\u003c/strong\u003e","component.themePreviewSampleStory.attribution.attribution":"\u003cstrong\u003eAttribution details go here\u003c/strong\u003e","component.themePreviewSampleStory.linkText":"This is your theme’s \u003ca href='#link-style'\u003elink style\u003c/a\u003e.","component.themePreviewSampleStory.basemap":"Express maps play a leading role in many place-based stories. You can select a basemap style and a feature color for this theme. These are just starting points; you can customize both the basemap and the feature colors in any express map in your story.","component.themePreviewSampleStory.basemap.caption":"A preview of this theme’s chosen basemap. If you’ve selected a web map, any feature layers will be hidden in express maps (like the map above), but they will be visible in map tour blocks.","component.themePreviewSampleStory.table.headerText1":"\u003cstrong\u003eHeader row\u003c/strong\u003e","component.themePreviewSampleStory.table.headerText2":"City","component.themePreviewSampleStory.table.dataText1":"Table cell","component.themePreviewSampleStory.table.largeNumber.text":"The accent color and heading font are also used for infographics.","component.themePreviewSampleStory.largeNumber.title":"3","component.themePreviewSampleStory.largeNumber.description":"Accent color and heading font.","component.themeEditor.storyHeaderText":"You can customize the color of this header","viewer.copySectionLink.tooltip":"Copy section link","viewer.copySectionLink.toast.fail":"Sorry, we couldn’t find that section","viewer.copySlideLink.toast.fail":"Sorry, we couldn’t find that slid
